name: Daily Blog Factory + GitHub Pages

on:
  schedule:
    - cron: '20 6 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      generate_topics:
        description: '오늘의 주제를 새로 생성한 뒤 배포'
        required: false
        default: true
        type: boolean

concurrency:
  group: pages-blog-factory
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install runtime build dependencies
        run: npm install --no-audit --no-fund --omit=dev

      - name: Build local runtime vendor
        run: npm run build:vendor

      - name: Check Daily Engine configuration
        id: daily-config
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_topics)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BLOG_FACTORY_SEED: ${{ vars.BLOG_FACTORY_SEED }}
        shell: bash
        run: |
          missing=()
          if [ -z "$OPENAI_API_KEY" ]; then missing+=("OPENAI_API_KEY secret"); fi
          if [ -z "$BLOG_FACTORY_SEED" ]; then missing+=("BLOG_FACTORY_SEED variable"); fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            printf -v missing_list '%s, ' "${missing[@]}"
            missing_list="${missing_list%, }"
            echo "::warning title=Daily Blog Factory skipped::필수 설정이 없어 오늘 주제 생성을 건너뜁니다: ${missing_list}. 사이트 검사와 Pages 배포는 계속됩니다."
            {
              echo '### Daily Blog Factory'
              echo
              echo '오늘 주제 생성은 건너뛰었지만 사이트 검사와 Pages 배포는 계속됩니다.'
              echo
              for item in "${missing[@]}"; do echo "- 누락: \`${item}\`"; done
              echo '- 설정 위치: Repository Settings > Secrets and variables > Actions'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo 'Daily Blog Factory configuration is ready.' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate today's blog topics
        if: >-
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_topics)) &&
          steps.daily-config.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          BLOG_FACTORY_SEED: ${{ vars.BLOG_FACTORY_SEED }}
          BLOG_FACTORY_AUDIENCE: ${{ vars.BLOG_FACTORY_AUDIENCE }}
          BLOG_FACTORY_AVOID_TOPICS: ${{ vars.BLOG_FACTORY_AVOID_TOPICS }}
        run: node .github/scripts/generate-daily-topics.mjs

      - name: JavaScript syntax checks
        run: |
          node --check .github/scripts/generate-daily-topics.mjs
          node --check ai-cleaner/js/boot.js
          node --check ai-cleaner/js/features/ai-writing-os.js
          node --check ai-cleaner/tests/static-check.mjs
          node --check ai-cleaner/tests/module-check.mjs
          node --check .github/scripts/build-pages-artifact.mjs
          node --check .github/scripts/build-runtime-vendor.mjs

      - name: Blog Factory static checks
        run: |
          node ai-cleaner/tests/module-check.mjs
          node ai-cleaner/tests/static-check.mjs

      - name: Persist generated daily topics
        if: >-
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_topics)) &&
          steps.daily-config.outputs.configured == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-cleaner/data/daily-topics.json
          if git diff --cached --quiet; then
            echo 'Daily topics are unchanged; no commit needed.'
          else
            DATE_KST="$(TZ=Asia/Seoul date +%F)"
            git commit -m "chore: update daily blog topics ${DATE_KST} [skip ci]"
            PUSHED=false
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                PUSHED=true
                break
              fi
              echo "Push attempt ${attempt} failed; rebasing onto the latest main before retrying."
              git fetch origin main
              git rebase origin/main
            done
            if [ "$PUSHED" != true ]; then
              echo 'Failed to persist daily topics after 3 attempts.'
              exit 1
            fi
          fi

      - name: Sync latest main before packaging
        shell: bash
        run: |
          git fetch origin main
          git merge --ff-only origin/main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare isolated GitHub Pages artifact
        run: node .github/scripts/build-pages-artifact.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.pages-site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
