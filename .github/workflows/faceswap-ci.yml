name: Actor Swap WEB checks

on:
  pull_request:
    paths:
      - "faceswap/**"
      - ".github/workflows/faceswap-ci.yml"
  push:
    branches:
      - "feat/faceswap-web-v0.7"
    paths:
      - "faceswap/**"
      - ".github/workflows/faceswap-ci.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check faceswap/src/capabilities.mjs
          node --check faceswap/src/app.mjs
          node --check faceswap/src/face_detector.mjs
          node --check faceswap/src/compositor.mjs
          node --check faceswap/src/audio_capture.mjs
          node --check faceswap/src/webm_duration.mjs
          node --check faceswap/src/video_lab.mjs
          node --check faceswap/tests/serve.mjs
          node --check faceswap/tests/e2e/local-render.spec.mjs
      - name: Node smoke checks
        run: node --test faceswap/tests/smoke.mjs

  browser-e2e:
    # Playwright 1.56 supports Ubuntu 24.04, but not ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install QA dependencies only
        working-directory: faceswap
        run: npm install --no-audit --no-fund
      - name: Install Chromium for QA
        working-directory: faceswap
        run: npx playwright install --with-deps chromium
      - name: Install FFmpeg and FFprobe for independent media verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate synthetic test footage and portrait
        run: |
          mkdir -p faceswap/tests/fixtures
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 -shortest -c:v libvpx -b:v 700k -c:a libopus -y faceswap/tests/fixtures/source.webm
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=yellow:size=256x256 -frames:v 1 -y faceswap/tests/fixtures/portrait.png
      - name: Test desktop and mobile-emulated Chromium
        working-directory: faceswap
        env:
          CI: "true"
        run: npm run test:browser
