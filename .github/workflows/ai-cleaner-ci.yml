name: AI Cleaner checks

on:
  pull_request:
    paths:
      - 'ai-cleaner/**'
      - 'index.html'
      - 'package.json'
      - 'OPTION/**'
      - '.github/workflows/ai-cleaner-ci.yml'
  push:
    branches:
      - main
      - 'agent/ai-cleaner-migration'
    paths:
      - 'ai-cleaner/**'
      - 'index.html'
      - 'package.json'
      - 'OPTION/**'
      - '.github/workflows/ai-cleaner-ci.yml'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Protect OPTION path
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE_SHA="$PR_BASE_SHA"; else BASE_SHA="$BEFORE_SHA"; fi
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
          if [ -z "$BASE_SHA" ]; then echo 'No comparable parent commit; skipping OPTION diff guard for this initial commit.'; exit 0; fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s
' "$CHANGED" | grep -q '^OPTION/'; then echo 'ERROR: OPTION/** is a protected path and must not be changed.'; printf '%s
' "$CHANGED" | grep '^OPTION/'; exit 1; fi
          echo 'OPTION/** unchanged.'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript syntax
        run: |
          node --check ai-cleaner/js/app.js
          node --check ai-cleaner/js/rewrite-studio.js
          node --check ai-cleaner/js/image-analyzer.js
          node --check ai-cleaner/tests/regression.js
          node --check ai-cleaner/tests/report.js
          node --check ai-cleaner/tests/static-check.mjs
          node --check ai-cleaner/tests/e2e.spec.mjs
      - name: Static checks
        run: node ai-cleaner/tests/static-check.mjs

  browser-smoke:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ai-cleaner-http.log 2>&1 &
          echo $! > /tmp/ai-cleaner-http.pid
      - name: Browser smoke test
        run: npm run test:e2e
