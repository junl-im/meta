name: AI Cleaner checks

on:
  pull_request:
    paths:
      - 'ai-cleaner/**'
      - '.github/workflows/ai-cleaner-ci.yml'
  push:
    branches:
      - main
      - 'agent/ai-cleaner-migration'
    paths:
      - 'ai-cleaner/**'
      - '.github/workflows/ai-cleaner-ci.yml'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect OPTION path
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^OPTION/'; then
            echo 'ERROR: OPTION/** is a protected path and must not be changed.'
            git diff --name-only origin/main...HEAD | grep '^OPTION/'
            exit 1
          fi
          echo 'OPTION/** unchanged.'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript syntax
        run: |
          node --check ai-cleaner/js/app.js
          node --check ai-cleaner/js/image-analyzer.js
          node --check ai-cleaner/tests/regression.js
          node --check ai-cleaner/tests/report.js
          node --check ai-cleaner/tests/static-check.mjs

      - name: Static migration checks
        run: node ai-cleaner/tests/static-check.mjs
