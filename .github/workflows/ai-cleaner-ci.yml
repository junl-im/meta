name: AI Cleaner checks + GitHub Pages

on:
  pull_request:
    paths:
      - 'ai-cleaner/**'
      - 'index.html'
      - 'package.json'
      - 'OPTION/**'
      - '.github/workflows/ai-cleaner-ci.yml'
  push:
    branches:
      - main
      - 'agent/ai-cleaner-migration'

concurrency:
  group: ai-cleaner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Protect OPTION path
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE_SHA="$PR_BASE_SHA"; else BASE_SHA="$BEFORE_SHA"; fi
          if [ -z "$BASE_SHA" ] || echo "$BASE_SHA" | grep -Eq '^0+$'; then BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
          if [ -z "$BASE_SHA" ]; then echo 'No comparable parent commit; skipping OPTION diff guard for this initial commit.'; exit 0; fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if printf '%s\n' "$CHANGED" | grep -q '^OPTION/'; then
            echo 'ERROR: OPTION/** is a protected path and must not be changed.'
            printf '%s\n' "$CHANGED" | grep '^OPTION/'
            exit 1
          fi
          echo 'OPTION/** unchanged.'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: JavaScript syntax
        run: |
          node --check ai-cleaner/js/core/event-bus.js
          node --check ai-cleaner/js/core/history-store.js
          node --check ai-cleaner/js/core/work-lock.js
          node --check ai-cleaner/js/core/text-utils.js
          node --check ai-cleaner/js/core/state-store.js
          node --check ai-cleaner/js/core/text-engine.js
          node --check ai-cleaner/js/core/diff-engine.js
          node --check ai-cleaner/js/services/analysis-worker-adapter.js
          node --check ai-cleaner/js/services/analysis-performance-governor.js
          node --check ai-cleaner/js/services/analysis-coordinator.js
          node --check ai-cleaner/js/workers/text-analysis-worker.js
          node --check ai-cleaner/js/services/update-manager.js
          node --check ai-cleaner/js/ui/panel-manager.js
          node --check ai-cleaner/js/ui/diff-view.js
          node --check ai-cleaner/js/features/file-import.js
          node --check ai-cleaner/js/features/typewriter-engine.js
          node --check ai-cleaner/js/app.js
          node --check ai-cleaner/js/rewrite-studio.js
          node --check ai-cleaner/js/image-analyzer.js
          node --check ai-cleaner/tests/regression.js
          node --check ai-cleaner/tests/report.js
          node --check ai-cleaner/tests/static-check.mjs
          node --check ai-cleaner/tests/module-check.mjs
          node --check ai-cleaner/tests/e2e.spec.mjs
      - name: Modular core unit checks
        run: node ai-cleaner/tests/module-check.mjs
      - name: Static checks
        run: node ai-cleaner/tests/static-check.mjs

  browser-smoke:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Playwright test runner
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ai-cleaner-http.log 2>&1 &
          echo $! > /tmp/ai-cleaner-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ai-cleaner/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ai-cleaner-http.log
          exit 1
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Preview diagnostics on failure
        if: failure()
        run: |
          echo '--- preview server ---'
          cat /tmp/ai-cleaner-http.log 2>/dev/null || true
          echo '--- playwright output ---'
          find test-results -maxdepth 3 -type f -print 2>/dev/null || true

  pages-package:
    needs: browser-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      deployable: ${{ steps.head.outputs.deployable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip stale main deployment
        id: head
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo 'deployable=true' >> "$GITHUB_OUTPUT"
            echo 'This run still matches the current main branch.'
          else
            echo 'deployable=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; skipping this stale Pages deployment.'
          fi
      - name: Configure GitHub Pages
        if: steps.head.outputs.deployable == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: steps.head.outputs.deployable == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  pages-deploy:
    needs: pages-package
    if: needs.pages-package.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

