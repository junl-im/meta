<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>곰같은여우의 AI 흔적 지우개 · Migration</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><span class="fox" aria-hidden="true">🦊</span><div><strong>곰같은여우의 AI 흔적 지우개</strong><small>GitHub migration workspace</small></div></div>
      <span class="badge">Phase 1</span>
    </header>
    <section class="card">
      <h1>대규모 이사 프로젝트 시작</h1>
      <p>기존 v6.2 단일 HTML을 유지보수 가능한 모듈 구조로 옮기는 작업 공간입니다.</p>
      <div class="grid">
        <article><b>텍스트 엔진</b><span>Unicode · X-ray · 정규화 · 문장 검토</span></article>
        <article><b>이미지 엔진</b><span>메타데이터 · C2PA · 출처 신호 분석</span></article>
        <article><b>배포</b><span>GitHub Pages · main / 루트 Branch 방식 유지</span></article>
        <article><b>보호 영역</b><span>OPTION/** 수정·이동·삭제 금지</span></article>
      </div>
      <div id="status" class="status">마이그레이션 기반 구조 준비 완료</div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
